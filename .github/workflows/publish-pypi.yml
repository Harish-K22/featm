name: Publish reviewed release to PyPI
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: featm-pypi-v0.5.8
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.repository == 'Harish-K22/featm' &&
      github.repository_id == '1409483295' &&
      github.event.repository.private == false &&
      github.actor == 'Harish-K22' &&
      github.event.release.draft == false &&
      github.event.release.prerelease == false &&
      github.event.release.tag_name == 'v0.5.8' &&
      github.event.release.author.login == 'Harish-K22'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/v0.5.8
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify owner-approved release commit
        env:
          APPROVED_RELEASE_COMMIT: ${{ vars.FEATM_APPROVED_RELEASE_COMMIT }}
        run: |
          python -c "import os,re,subprocess; expected=os.environ['APPROVED_RELEASE_COMMIT']; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); assert re.fullmatch('[0-9a-f]{40}',expected), 'Set the repository variable FEATM_APPROVED_RELEASE_COMMIT to the reviewed full SHA'; assert actual==expected, 'Release tag does not point to the approved commit'; print('Approved source commit:',actual)"
      - name: Validate exact source version and build
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install build twine
          python -c "import os,tomllib; p=tomllib.load(open('pyproject.toml','rb'))['project']; assert p['name']=='featm' and p['version']=='0.5.8' and os.environ['RELEASE_TAG']=='v'+p['version']"
          python -m build
          python -m twine check dist/*
          python .github/scripts/check_release.py dist
          python .github/scripts/test_wheel.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-distribution-hashes
          path: release-artifact-hashes.json
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish using OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
