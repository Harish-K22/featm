[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "featm"
version = "0.5.9"
description = "A searchable Python library for explicit, named feature extraction across data modalities."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "featm contributors"}]
license = {text = "MIT"}
keywords = [
  "feature-engineering",
  "feature-extraction",
  "machine-learning",
  "time-series",
  "signal-processing",
  "computational-geometry",
  "graphs",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/Harish-K22/featm"
Repository = "https://github.com/Harish-K22/featm"
Issues = "https://github.com/Harish-K22/featm/issues"

[project.optional-dependencies]
io = [
  "pyarrow>=14",
  "polars>=1.0",
]
distributed = [
  "dask[distributed]>=2024.1",
]
scientific = [
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
]
geometry = [
  "scipy>=1.10",
  "scikit-learn>=1.3",
]
graph = [
  "networkx>=3.0",
  "scipy>=1.10",
  "python-igraph>=0.11",
  "leidenalg>=0.10",
  "gensim>=4.4; python_version < '3.14'",
]
# node2vec 0.5 constrains NumPy to 1.x. Keep it separate from ordinary
# graph/full stacks so those can coexist with the NumPy-2 CUDA backend.
graph-node2vec = [
  "networkx>=3.0; python_version < '3.13'",
  "gensim>=4.4; python_version < '3.13'",
  "node2vec>=0.5; python_version < '3.13'",
]
audio = [
  "librosa>=0.11,<1.0; python_version < '3.12'",
  "librosa>=1.0; python_version >= '3.12'",
  "scipy>=1.10",
]
vision = [
  "opencv-python>=4.8",
  "scikit-image>=0.22",
  "scipy>=1.10",
]
signal = [
  "scipy>=1.10",
  "statsmodels>=0.14",
  "EMD-signal>=1.6",
  "vmdpy>=0.2",
]
topology = [
  "gudhi>=3.9",
  "scipy>=1.10",
]
pointcloud = [
  "open3d>=0.18",
  "scipy>=1.10",
]
text = [
  "scikit-learn>=1.3",
  "gensim>=4.4",
  "spacy>=3.7",
]
embeddings = [
  "torch>=2.2",
  "timm>=1.0",
  "transformers>=4.40",
  "sentence-transformers>=3.0",
  "Pillow>=10",
]
calendar = [
  "holidays>=0.50",
]
# Step 3: GPU execution backend. `pip install featm` (no extra) stays CPU-only
# and never imports these -- see featm/gpu/backend.py's lazy-probe design.
# `gpu` is the recommended default (CuPy only, the backend every kernel in
# this milestone actually targets); `gpu-cupy` is kept as an explicit synonym
# for clarity when a project also uses `gpu-torch`/`gpu-rapids` and wants to
# name the CuPy requirement unambiguously. Pick ONE CuPy CUDA-version wheel
# for your platform (cupy-cuda12x/cupy-cuda11x/...) -- see
# https://docs.cupy.dev/en/stable/install.html; `cupy-cuda12x` is listed here
# as the common case on current cloud/Kaggle GPU images, not a hard mandate.
gpu = [
  "cupy-cuda12x[ctk]>=14.0; sys_platform != 'darwin'",
]
gpu-cupy = [
  "cupy-cuda12x[ctk]>=14.0; sys_platform != 'darwin'",
]
# Optional: only needed for a future Torch-model-routing GPU feature (none
# in this milestone requires it -- every kernel in featm/gpu/kernels/ is
# CuPy-only). Installable independently of `gpu`/`gpu-cupy`.
gpu-torch = [
  "torch>=2.2",
]
# Optional, NOT required for this milestone's GPU surface at all (no kernel
# uses cuDF/cuML) -- listed only so a user who wants to experiment with
# RAPIDS-backed features in a future pass has a documented extras name to
# reach for. RAPIDS packages are not on PyPI in the usual sense (conda or
# NVIDIA's own index is standard); this extra intentionally has no pinned
# requirement, it exists as a documented placeholder, not a functioning
# installable set -- see docs/SCALING.md's GPU section.
gpu-rapids = []
full = [
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "networkx>=3.0",
  "python-igraph>=0.11",
  "leidenalg>=0.10",
  "librosa>=0.11,<1.0; python_version < '3.12'",
  "librosa>=1.0; python_version >= '3.12'",
  "opencv-python>=4.8",
  "scikit-image>=0.22",
  "EMD-signal>=1.6",
  "vmdpy>=0.2",
  "gudhi>=3.9",
  "open3d>=0.18",
  "gensim>=4.4",
  "spacy>=3.7",
  "holidays>=0.50",
  "torch>=2.2",
  "timm>=1.0",
  "transformers>=4.40",
  "sentence-transformers>=3.0",
  "Pillow>=10",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "build>=1.2",
]

[project.scripts]
featm = "featm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
